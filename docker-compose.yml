services:
  backend:
    build:
      context: ./backend
    container_name: lyftr-backend
    env_file:
      - path: .env
        required: false
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini/gemini-3.5-flash-lite}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
    ports:
      - "8000:8000"
    volumes:
      - chat_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: lyftr-frontend
    environment:
      API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chat_data:
